services:
  qdrant:
    image: qdrant/qdrant:v1.13.4
    container_name: mc-qdrant
    ports:
      - "6333:6333"   # REST + dashboard at http://localhost:6333/dashboard
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  # copilot, web, simulator and mlops services are added in later weeks.

volumes:
  qdrant_data:
