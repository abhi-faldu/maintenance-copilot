[project]
name = "maintenance-copilot"
version = "0.1.0"
description = "Agentic RAG assistant for shop-floor maintenance"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "pymupdf>=1.24",
    "qdrant-client>=1.12",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
]

[project.optional-dependencies]
# Real embeddings. Pulls in torch; the first run downloads BAAI/bge-m3 (~2.3 GB).
embed = ["sentence-transformers>=3.0"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "markdown>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ingest", "copilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["corpus/private"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
